name: Build Modern Hub
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Download toolchain
        run: |
          mkdir -p lib build/classes build/stubs dist res
          M=https://repo1.maven.org/maven2/org/microemu
          curl -fL $M/microemu-cldc/2.0.4/microemu-cldc-2.0.4.jar -o lib/cldc.jar
          curl -fL $M/microemu-midp/2.0.4/microemu-midp-2.0.4.jar -o lib/midp.jar
          curl -fL https://github.com/Guardsquare/proguard/releases/download/v7.2.2/proguard-7.2.2.zip -o pg.zip
          unzip -q pg.zip
      - name: Write API stubs
        run: |
          mkdir -p stubs/javax/microedition/io/file stubs/javax/microedition/media/control
          cat > stubs/javax/microedition/io/PushRegistry.java <<'EOF'
          package javax.microedition.io;
          public class PushRegistry {
              public static long registerAlarm(String midlet, long time) throws ClassNotFoundException, ConnectionNotFoundException { return 0L; }
          }
          EOF
          cat > stubs/javax/microedition/io/file/FileConnection.java <<'EOF'
          package javax.microedition.io.file;
          import java.io.IOException;
          import java.io.OutputStream;
          public interface FileConnection extends javax.microedition.io.Connection {
              boolean exists();
              void create() throws IOException;
              OutputStream openOutputStream() throws IOException;
          }
          EOF
          cat > stubs/javax/microedition/media/Control.java <<'EOF'
          package javax.microedition.media;
          public interface Control {}
          EOF
          cat > stubs/javax/microedition/media/MediaException.java <<'EOF'
          package javax.microedition.media;
          public class MediaException extends Exception {
              public MediaException() {}
              public MediaException(String s) { super(s); }
          }
          EOF
          cat > stubs/javax/microedition/media/Player.java <<'EOF'
          package javax.microedition.media;
          public interface Player {
              void realize() throws MediaException;
              void start() throws MediaException;
              void stop() throws MediaException;
              void close();
              Control getControl(String type);
          }
          EOF
          cat > stubs/javax/microedition/media/Manager.java <<'EOF'
          package javax.microedition.media;
          import java.io.IOException;
          public class Manager {
              public static Player createPlayer(String locator) throws IOException, MediaException { return null; }
          }
          EOF
          cat > stubs/javax/microedition/media/control/VideoControl.java <<'EOF'
          package javax.microedition.media.control;
          import javax.microedition.media.Control;
          import javax.microedition.media.MediaException;
          public interface VideoControl extends Control {
              int USE_GUI_PRIMITIVE = 0;
              int USE_DIRECT_VIDEO = 1;
              Object initDisplayMode(int mode, Object arg);
              void setDisplayLocation(int x, int y);
              void setDisplaySize(int w, int h) throws MediaException;
              void setVisible(boolean visible);
              byte[] getSnapshot(String type) throws MediaException;
          }
          EOF
      - name: Make icon
        run: |
          python3 - <<'PY'
          import zlib, struct, os
          S, SS = 40, 4
          def rr(x, y, x0, y0, x1, y1, r):
              if x < x0 or x > x1 or y < y0 or y > y1:
                  return False
              cx = min(max(x, x0 + r), x1 - r)
              cy = min(max(y, y0 + r), y1 - r)
              return (x - cx) ** 2 + (y - cy) ** 2 <= r * r
          TILES = [(7, 7, (10, 132, 255)), (21, 7, (255, 159, 10)), (7, 21, (48, 209, 88)), (21, 21, (255, 55, 95))]
          def sample(x, y):
              if not rr(x, y, 1, 1, 39, 39, 9):
                  return None
              t = (x + y) / 80.0
              col = (int(28 + 30 * t), int(28 + 30 * t), int(46 + 44 * t))
              for tx, ty, c in TILES:
                  if rr(x, y, tx, ty, tx + 12, ty + 12, 3):
                      col = c
              return col
          raw = bytearray()
          for py in range(S):
              raw.append(0)
              for px in range(S):
                  r = g = b = a = 0
                  for sy in range(SS):
                      for sx in range(SS):
                          c = sample(px + (sx + 0.5) / SS, py + (sy + 0.5) / SS)
                          if c:
                              r += c[0]; g += c[1]; b += c[2]; a += 1
                  n = SS * SS
                  if a:
                      raw += bytes((r // a, g // a, b // a, 255 * a // n))
                  else:
                      raw += bytes((0, 0, 0, 0))
          def chunk(t, d):
              c = struct.pack('>I', len(d)) + t + d
              return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', S, S, 8, 6, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(bytes(raw), 9)) + chunk(b'IEND', b'')
          os.makedirs('res', exist_ok=True)
          open('res/icon.png', 'wb').write(png)
          PY
      - name: Compile
        run: |
          find stubs -name '*.java' > stubs.txt
          javac -source 1.3 -target 1.3 -classpath lib/midp.jar:lib/cldc.jar -d build/stubs @stubs.txt
          javac -source 1.3 -target 1.3 -classpath build/stubs:lib/midp.jar:lib/cldc.jar -d build/classes src/*.java
          jar cf build/in.jar -C build/classes .
      - name: Preverify with ProGuard
        run: |
          java -jar proguard-7.2.2/lib/proguard.jar -injars build/in.jar -outjars build/out.jar \
            -libraryjars "$JAVA_HOME/jre/lib/rt.jar" \
            -libraryjars build/stubs -libraryjars lib/midp.jar -libraryjars lib/cldc.jar \
            -microedition -dontobfuscate -dontoptimize -dontwarn -ignorewarnings \
            -keep "public class ModernNotes"
      - name: Package JAR + JAD
        run: |
          V="2.0.${GITHUB_RUN_NUMBER}"
          mkdir pre && cd pre && unzip -q ../build/out.jar && rm -rf META-INF && cd ..
          cp res/icon.png pre/icon.png
          printf 'Manifest-Version: 1.0\nMIDlet-1: Modern Hub, /icon.png, ModernNotes\nMIDlet-Icon: /icon.png\nMIDlet-Name: Modern Notes\nMIDlet-Vendor: Me\nMIDlet-Version: %s\nMicroEdition-Configuration: CLDC-1.0\nMicroEdition-Profile: MIDP-2.0\nMIDlet-Permissions-Opt: javax.microedition.io.PushRegistry, javax.microedition.io.Connector.file.read, javax.microedition.io.Connector.file.write, javax.microedition.media.control.VideoControl.getSnapshot\n' "$V" > manifest.mf
          jar cfm dist/ModernNotes.jar manifest.mf -C pre .
          SIZE=$(stat -c%s dist/ModernNotes.jar)
          { sed '1d' manifest.mf; echo "MIDlet-Jar-URL: ModernNotes.jar"; echo "MIDlet-Jar-Size: $SIZE"; } > dist/ModernNotes.jad
      - uses: actions/upload-artifact@v4
        with:
          name: ModernNotes
          path: dist/
